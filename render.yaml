services:
  - type: web
    name: pace-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: huggingface
      - key: CORS_ORIGINS
        value: https://pace.huzaifazaman.com,https://pace-ensemble.netlify.app,http://tauri.localhost,https://tauri.localhost
      - key: DATABASE_URL
        sync: false
      - key: HF_SPACE_ID
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: AI_TIMEOUT_SECONDS
        value: '240'
      - key: SANDBOX_ENABLED
        value: 'false'
