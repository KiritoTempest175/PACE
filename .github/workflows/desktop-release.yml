name: Package PACE Desktop for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tauri-desktop
    paths:
      - .github/desktop-release.request

permissions:
  contents: write

concurrency:
  group: pace-desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: Tauri 2 Windows with bundled Python API and source release
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust packages
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run frontend lint and unit tests
        working-directory: frontend
        run: |
          npm run lint
          npm test
      - name: Generate native icons from the included SVG
        working-directory: frontend
        run: npx --yes @tauri-apps/cli@2.12.1 icon src-tauri/icons/icon-source.svg
      - name: Validate Rust crate metadata
        working-directory: frontend/src-tauri
        run: cargo metadata --format-version 1 --no-deps
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen backend requirements
        run: python -m pip install -r desktop/requirements-local.txt
      - name: Freeze local PACE FastAPI backend
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name pace-api --paths . --collect-all pymupdf --collect-submodules sqlalchemy.dialects --hidden-import fitz --hidden-import masteries.services.ollama_provider --hidden-import masteries.services.telemetry desktop/backend_entry.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed.' }
          New-Item -ItemType Directory -Force frontend/src-tauri/binaries | Out-Null
          Copy-Item dist/pace-api.exe frontend/src-tauri/binaries/pace-api-x86_64-pc-windows-msvc.exe
      - name: Smoke-test actual frozen local backend on Windows
        run: python desktop/smoke_backend.py dist/pace-api.exe
      - name: Verify bundled backend exists and has realistic size
        shell: pwsh
        run: |
          $exe = Get-Item 'frontend/src-tauri/binaries/pace-api-x86_64-pc-windows-msvc.exe'
          if ($exe.Length -lt 5000000) { throw 'Bundled Python backend seems incomplete.' }
          Write-Host ('Embedded FastAPI sidecar size: ' + $exe.Length + ' bytes')
      - name: Build Tauri NSIS installer
        working-directory: frontend
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles nsis
      - name: Verify installer exists
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem 'frontend/src-tauri/target/release/bundle/nsis' -Filter '*.exe')
          if ($bundles.Count -eq 0) { throw 'No Windows NSIS setup executable was produced.' }
          $bundles | ForEach-Object { Write-Host ('Installer: ' + $_.Name + ' (' + $_.Length + ' bytes)') }
      - name: Archive frontend and desktop source from tracked files
        shell: pwsh
        run: |
          git archive --format=zip --output=PACE_Web_Source.zip HEAD frontend/src frontend/public frontend/index.html frontend/package.json frontend/package-lock.json frontend/vite.config.js backend core masteries ai-service docs LICENSE README.md netlify.toml render.yaml
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate web source archive.' }
          git archive --format=zip --output=PACE_Desktop_Source.zip HEAD frontend desktop LICENSE README.md backend core masteries ai-service
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate desktop source archive.' }
      - name: Archive entire repository source for contributors
        shell: pwsh
        run: |
          git archive --format=zip --output=PACE_Complete_Source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Failed to archive complete source.' }
      - name: Upload installer and sources to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PACE-Desktop-Windows-and-Source
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            PACE_Web_Source.zip
            PACE_Desktop_Source.zip
            PACE_Complete_Source.zip
          retention-days: 30
          if-no-files-found: error
      - name: Create draft GitHub Release with installer and source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'desktop-v0.2.0'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --target $env:GITHUB_SHA --draft --title 'PACE Desktop 0.2.0 (Windows, bundled local API)' --notes 'PACE Desktop 0.2 includes an automatically launched local FastAPI+SQLite+PDF backend. Offline AI still needs Ollama and the qwen2.5-coder:1.5b model installed separately. Unsigned prerelease; review before publishing.'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create GitHub draft release.' }
          }
          $installer = @(Get-ChildItem 'frontend/src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1)
          gh release upload $tag --repo $repo $installer.FullName PACE_Web_Source.zip PACE_Desktop_Source.zip PACE_Complete_Source.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload release assets.' }
