name: Deploy PACE frontend to Netlify

on:
  workflow_dispatch:
    inputs:
      publish_production:
        description: "Publish to pace-ensemble.netlify.app only after preview verification"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - phase2/production-hardening-20261009
    paths:
      - .github/netlify-preview.request

permissions:
  contents: read

concurrency:
  group: pace-netlify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Netlify frontend
    runs-on: ubuntu-latest
    environment: NETLIFY
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ba128faa-c6da-43f7-9fcc-4d51db32e87c
      VITE_API_BASE_URL: https://pace-phase2-api.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require Netlify token
        shell: bash
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" ]]; then
            echo "::error::Add NETLIFY_AUTH_TOKEN as a repository secret or in the NETLIFY GitHub environment."
            exit 1
          fi
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Lint and test
        run: |
          npm run lint
          npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Install Netlify CLI
        run: npm install -g 'netlify-cli@23'
      - name: Preview deploy, never publish to production
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_production != true }}
        run: netlify deploy --dir=frontend/dist --message="PACE Phase 2 preview" --json
      - name: Production deploy, explicit manual opt-in only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_production == true }}
        run: netlify deploy --prod --dir=frontend/dist --message="PACE Phase 2 production" --json
