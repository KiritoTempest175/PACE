name: PACE v0.1.0-rc1 prerelease (no production deploy)
on:
  workflow_dispatch:
  push:
    branches: [feature/tauri-desktop]
    paths:
      - .github/workflows/publish-rc1.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: pace-v0.1.0-rc1
  cancel-in-progress: false
jobs:
  native:
    name: Package ${{ matrix.os }} ${{ matrix.bundles }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-24.04
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tauri-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
          sudo apt-get install -y libfuse2t64 || true
      - name: Install Python backend packaging
        run: python -m pip install -r desktop/requirements-local.txt
      - name: Run backend tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests
      - name: Build bundled Python sidecar
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name pace-api --paths . --collect-all pymupdf --collect-submodules sqlalchemy.dialects --hidden-import fitz --hidden-import desktop.model_manager --hidden-import masteries.services.ollama_provider --hidden-import masteries.services.telemetry desktop/backend_entry.py
      - name: Place Tauri sidecar
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p frontend/src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/pace-api.exe "frontend/src-tauri/binaries/pace-api-${TARGET}.exe"
          else
            cp dist/pace-api "frontend/src-tauri/binaries/pace-api-${TARGET}"
          fi
      - name: Frontend build, lint and tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
      - name: Generate desktop icon bundle
        working-directory: frontend
        run: npx --yes @tauri-apps/cli@2.12.1 icon src-tauri/icons/icon-source.svg
      - name: Build unsigned installers
        working-directory: frontend
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles ${{ matrix.bundles }}
      - name: Upload succeeded installer files
        uses: actions/upload-artifact@v4
        with:
          name: pace-rc1-${{ matrix.os }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
  web-test:
    name: Build isolated web preview ZIP from main
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: web-main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-main/frontend/package-lock.json
      - name: Build web artifact with local FastAPI endpoint
        working-directory: web-main/frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run check:links
          npm run build
      - name: Zip tested web static bundle
        run: |
          test -f web-main/frontend/dist/index.html
          (cd web-main/frontend/dist && zip -qr "$GITHUB_WORKSPACE/PACE_Web_Test_dist.zip" .)
          unzip -l PACE_Web_Test_dist.zip | grep index.html
      - uses: actions/upload-artifact@v4
        with:
          name: pace-rc1-web-local
          path: PACE_Web_Test_dist.zip
          if-no-files-found: error
          retention-days: 30
  prerelease:
    name: Publish only successful artifacts (pre-release, not latest)
    runs-on: ubuntu-latest
    needs: [native, web-test]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tauri-desktop
      - name: Fetch successful build artifacts (missing platforms allowed)
        uses: actions/download-artifact@v4
        with:
          pattern: pace-rc1-*
          path: release/raw
          merge-multiple: true
      - name: Collect installers and web ZIP
        run: |
          set -euo pipefail
          mkdir -p release/assets
          find release/raw -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.dmg' -o -iname '*.AppImage' -o -iname '*.deb' -o -name 'PACE_Web_Test_dist.zip' \) -print0 | while IFS= read -r -d '' file; do cp "$file" release/assets/; done
          test "$(find release/assets -type f | wc -l)" -gt 0
          (cd release/assets && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          cat release/assets/SHA256SUMS.txt
      - name: Build release notes with actual platform status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp docs/RELEASE_NOTES_v0.1.0-rc1.md release/NOTES.md
          {
            echo
            echo "## Assets actually built by this workflow"
            echo
            for extension in exe dmg AppImage deb; do
              case "$extension" in
                exe) platform=Windows ;;
                dmg) platform=macOS ;;
                AppImage) platform="Linux AppImage" ;;
                deb) platform="Linux DEB" ;;
              esac
              if find release/assets -maxdepth 1 -iname "*.$extension" | grep -q .; then
                echo "- **$platform:** included (unsigned)."
              else
                echo "- **$platform:** unavailable / build failed; see workflow logs for the failing step and reason."
              fi
            done
            if test -f release/assets/PACE_Web_Test_dist.zip; then echo "- **Local web test ZIP:** included, bound to http://127.0.0.1:8000."; else echo "- **Local web test ZIP:** build failed; use the docs/TESTING.md source-build fallback."; fi
            echo
            echo "Build logs: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> release/NOTES.md
      - name: Create or update GitHub PRE-RELEASE (never latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.1.0-rc1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --title "PACE v0.1.0-rc1 (unsigned test builds)" --notes-file release/NOTES.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "PACE v0.1.0-rc1 (unsigned test builds)" --notes-file release/NOTES.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release/assets/* --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets --jq '{url,isPrerelease,assets:[.assets[].name]}'
