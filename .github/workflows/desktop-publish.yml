name: Publish tested PACE Desktop v0.5.0 RC1
on:
  push:
    branches: [feature/tauri-desktop]
    paths: [.github/desktop-publish.request]
permissions:
  contents: write
  actions: read
concurrency:
  group: pace-desktop-rc1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact successful native-build commit
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sed -n 's/^source_sha=//p' .github/desktop-publish.request | head -n1)"
          TAG="$(sed -n 's/^tag=//p' .github/desktop-publish.request | head -n1)"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid source SHA"; exit 1; }
          test "$TAG" = desktop-v0.5.0-rc1
          git cat-file -e "$SHA^{commit}"
          RUN=""
          for attempt in $(seq 1 100); do
            records="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/desktop-native-ci.yml/runs?branch=feature%2Ftauri-desktop&per_page=100")"
            RUN="$(echo "$records" | jq -r --arg sha "$SHA" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' | head -n1)"
            test -n "$RUN" && break
            BAD="$(echo "$records" | jq -r --arg sha "$SHA" '.workflow_runs[] | select(.head_sha == $sha and (.conclusion == "failure" or .conclusion == "cancelled")) | .id' | head -n1)"
            test -z "$BAD" || { echo "::error::Native build $BAD failed; release not published"; exit 1; }
            echo "Waiting for verified native installers from $SHA (check $attempt)"
            sleep 15
          done
          test -n "$RUN" || { echo "::error::No successful 3-platform native build for $SHA"; exit 1; }
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Download Windows, macOS and Linux assets from one tested run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.tested.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D artifacts --pattern 'pace-desktop-*-unsigned'
          find artifacts -type f -printf '%p (%s bytes)\n'
      - name: Validate installers and prepare checksums and source ZIP
        env:
          SOURCE_SHA: ${{ steps.tested.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -d '' WIN < <(find artifacts -type f -iname '*.exe' -print0)
          mapfile -d '' MAC < <(find artifacts -type f -iname '*.dmg' -print0)
          mapfile -d '' DEB < <(find artifacts -type f -iname '*.deb' -print0)
          mapfile -d '' APP < <(find artifacts -type f -iname '*.AppImage' -print0)
          test "${#WIN[@]}" -eq 1 || { echo "::error::Expected one Windows EXE"; exit 1; }
          test "${#MAC[@]}" -eq 1 || { echo "::error::Expected one macOS DMG"; exit 1; }
          test "${#DEB[@]}" -eq 1 || { echo "::error::Expected one Linux DEB"; exit 1; }
          for file in "${WIN[0]}" "${MAC[0]}" "${DEB[0]}"; do
            test "$(stat -c %s "$file")" -gt 1000000
            cp "$file" "release/$(basename "$file")"
          done
          for file in "${APP[@]}"; do
            if test "$(stat -c %s "$file")" -gt 1000000; then cp "$file" "release/$(basename "$file")"; fi
          done
          cp desktop/RELEASE_NOTES_v0.5.0-rc1.md release/RELEASE_NOTES.md
          cp desktop/README_LOCAL.md release/INSTALLATION.md
          git archive --format=zip --output=release/PACE_Desktop_Source_v0.5.0-rc1.zip "$SOURCE_SHA" frontend desktop backend core masteries LICENSE README.md
          (
            cd release
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          ls -lh release/
      - name: Keep downloadable complete release bundle if GitHub blocks publication
        uses: actions/upload-artifact@v4
        with:
          name: PACE-Desktop-v0.5.0-rc1-Complete-Release-Bundle
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish public pre-release after validating all assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACE_RELEASE_TOKEN: ${{ secrets.PACE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ steps.tested.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=desktop-v0.5.0-rc1
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag exists; refusing to overwrite a prior release"
            exit 1
          fi
          make_release() {
            gh release create "$TAG" release/* -R "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft --prerelease --title 'PACE Desktop v0.5.0 RC1 — Local-first AI and branded setup' --notes-file desktop/RELEASE_NOTES_v0.5.0-rc1.md
          }
          if ! make_release; then
            test -n "$PACE_RELEASE_TOKEN" || exit 1
            GH_TOKEN="$PACE_RELEASE_TOKEN" make_release
          fi
          NUM="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$NUM" -ge 7 || { echo "::error::Incomplete release assets; kept as draft"; exit 1; }
          if ! gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease; then
            test -n "$PACE_RELEASE_TOKEN" || exit 1
            GH_TOKEN="$PACE_RELEASE_TOKEN" gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,tagName,assets
