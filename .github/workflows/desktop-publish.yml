name: Publish tested PACE Desktop v0.4
on:
  push:
    branches: [feature/tauri-desktop]
    paths: [.github/desktop-publish.request]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact installer and all source/built-web assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view desktop-v0.4.0 --repo "$GITHUB_REPOSITORY" --json assets,isDraft,tagName > /tmp/release.json
          jq -e '.isDraft == true' /tmp/release.json
          for asset in PACE_Web_Source.zip PACE_Web_Deploy_Bundle.zip PACE_Desktop_Source.zip PACE_Complete_Source.zip; do
            jq -e --arg asset "$asset" '[.assets[].name] | index($asset) != null' /tmp/release.json
          done
          jq -e '[.assets[].name] | any(contains("0.4.0_x64-setup.exe"))' /tmp/release.json
          jq -r '.assets[] | [.name, (.size|tostring)] | @tsv' /tmp/release.json
      - name: Publish Windows v0.4 as public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit desktop-v0.4.0 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          gh release view desktop-v0.4.0 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url,assets
