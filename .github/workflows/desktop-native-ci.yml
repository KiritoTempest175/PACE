name: Verify PACE Desktop native builds (no publishing)
on:
  workflow_dispatch:
  push:
    branches: [feature/tauri-desktop]
    paths:
      - .github/workflows/desktop-native-ci.yml
      - 'frontend/src-tauri/**'
      - 'desktop/**'
      - 'frontend/src/**'
permissions:
  contents: read
jobs:
  native:
    name: Unsigned ${{ matrix.os }} Tauri installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: dmg
          - os: ubuntu-24.04
            bundle: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend packaging dependencies
        run: python -m pip install -r desktop/requirements-local.txt
      - name: Run backend regression tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests
      - name: Build native bundled Python sidecar
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name pace-api --paths . --collect-all pymupdf --collect-submodules sqlalchemy.dialects --hidden-import fitz --hidden-import desktop.model_manager --hidden-import masteries.services.ollama_provider --hidden-import masteries.services.telemetry desktop/backend_entry.py
      - name: Place sidecar in target-triple directory
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p frontend/src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/pace-api.exe "frontend/src-tauri/binaries/pace-api-${TARGET}.exe"
          else
            cp dist/pace-api "frontend/src-tauri/binaries/pace-api-${TARGET}"
          fi
      - name: Install and test React
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
      - name: Generate PNG ICO ICNS icon set from SVG
        working-directory: frontend
        run: npx --yes @tauri-apps/cli@2.12.1 icon src-tauri/icons/icon-source.svg
      - name: Generate branded NSIS artwork
        run: |
          python -m pip install Pillow==11.3.0
          python desktop/build_installer_art.py
      - name: Build unsigned Tauri bundle
        working-directory: frontend
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles ${{ matrix.bundle }}
      - name: Build AppImage (Linux only; optional portable alternative)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: frontend
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: pace-desktop-${{ matrix.os }}-unsigned
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
