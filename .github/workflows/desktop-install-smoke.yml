name: Verify installed PACE Desktop has bundled backend
on:
  push:
    branches:
      - feature/tauri-desktop
    paths:
      - .github/desktop-install-smoke.request
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PACE-Desktop-Windows-and-Source
          run-id: 37972608175
          repository: KiritoTempest175/PACE
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: package
      - name: Install NSIS package silently and verify backend is installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem package -Recurse -Filter '*setup.exe' | Select-Object -First 1)
          if ($installer.Count -ne 1) { throw 'Windows installer missing.' }
          $p = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw ('NSIS exit code: ' + $p.ExitCode) }
          Start-Sleep -Seconds 5
          $bins = @(Get-ChildItem $env:LOCALAPPDATA -File -Recurse -Filter 'pace-api.exe' -ErrorAction SilentlyContinue)
          if ($bins.Count -eq 0) {
            Get-ChildItem $env:LOCALAPPDATA -Directory | Select-Object FullName
            throw 'PACE local FastAPI executable not found in installed files.'
          }
          $backend = $bins[0]
          if ($backend.Length -lt 5000000) { throw 'Backend binary unexpectedly small.' }
          Write-Host ('VERIFIED installed backend: ' + $backend.FullName + ' (' + $backend.Length + ' bytes)')
          $apps = @(Get-ChildItem $backend.DirectoryName -File -Filter '*.exe' -ErrorAction Stop | Where-Object { $_.Name -ne 'pace-api.exe' -and $_.Name -match 'PACE' })
          if ($apps.Count -ne 1) { throw ('Expected exactly one distinct Tauri application executable, found ' + $apps.Count) }
          $appExe = $apps[0]
          if ($appExe.Length -lt 500000) { throw 'Tauri desktop executable is unexpectedly small.' }
          Write-Host ('VERIFIED installed Tauri GUI: ' + $appExe.FullName + ' (' + $appExe.Length + ' bytes)')
      - name: Launch installed Tauri application and check its local backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:LOCALAPPDATA 'PACE AI Workspaces'
          $appExe = @(Get-ChildItem $installDir -File -Filter '*.exe' | Where-Object { $_.Name -ne 'pace-api.exe' -and $_.Name -match 'PACE' } | Select-Object -First 1)
          if ($appExe.Count -ne 1) { throw 'Tauri GUI executable missing.' }
          $proc = Start-Process -FilePath $appExe[0].FullName -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 2
              $proc.Refresh()
              if ($proc.HasExited) { throw ('Tauri GUI exited early: ' + $proc.ExitCode) }
              $children = @(Get-CimInstance Win32_Process -Filter "Name='pace-api.exe'" -ErrorAction SilentlyContinue)
              if ($children.Count -gt 0) {
                Write-Host ('VERIFIED app auto-started local PACE API process(es): ' + $children.Count)
                $ready = $true
                break
              }
            }
            if (-not $ready) { throw 'GUI ran but did not start bundled FastAPI sidecar.' }
            $logs = @(Get-ChildItem $env:LOCALAPPDATA -Recurse -File -Filter 'pace-backend.log' -ErrorAction SilentlyContinue)
            foreach ($log in $logs) {
              Write-Host ('Local PACE backend diagnostic path: ' + $log.FullName)
            }
          } finally {
            if (-not $proc.HasExited) {
              $null = $proc.CloseMainWindow()
              Start-Sleep -Seconds 3
              $proc.Refresh()
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            }
          }
