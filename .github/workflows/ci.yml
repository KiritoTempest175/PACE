name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q backend core masteries ai-service
      - run: pytest -q tests
      - run: ruff check --select E4,E7,E9,F63,F7,F82 backend core masteries/api masteries/services/upload_service.py masteries/services/ai_gateway.py masteries/services/local_ensemble.py masteries/services/ollama_provider.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # A lockfile must be generated and committed before switching to npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
