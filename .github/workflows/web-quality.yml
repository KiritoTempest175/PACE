name: PACE Web Quality (no deployment)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/web-quality.yml
      - 'frontend/src/**'
      - 'frontend/scripts/**'
      - 'frontend/public/**'
      - 'frontend/index.html'
      - 'frontend/package*.json'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@1.57.0
      - name: Build and validate internal links
        working-directory: frontend
        run: |
          npm run check:links
          npm run build
      - name: Use preinstalled Playwright Chromium
        working-directory: frontend
        run: |
          CHROME=$(node -p "require('playwright').chromium.executablePath()")
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Start production preview
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pace-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pace-preview.log
          exit 1
      - name: Playwright responsive screenshots and horizontal-overflow checks
        working-directory: frontend
        run: npm run test:responsive
      - name: Lighthouse 90+ quality gates
        working-directory: frontend
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Archive browser screenshots and Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pace-web-quality-artifacts
          path: |
            frontend/artifacts/responsive/
            frontend/.lighthouseci/
          retention-days: 14
          if-no-files-found: warn
