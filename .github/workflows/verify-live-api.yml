name: Verify Render → Hugging Face → Neon
on:
  workflow_dispatch:
  push:
    branches:
      - phase2/production-hardening-20261009
    paths:
      - .github/pace-e2e.request
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real public API inference and persistent chat test
        run: python scripts/smoke_live_api.py
