[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pace"
version = "0.1.0"
description = "Pipelined Actor-Critic Ensemble AI microservice"
requires-python = ">=3.10"
authors = [
    {name = "Muhammad Huzaifa Zaman", email = "huzaifazaman38@gmail.com"}
]
dependencies = [
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[tool.pyright]
pythonVersion = "3.10"
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]

